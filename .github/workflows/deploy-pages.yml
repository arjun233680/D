name: Deploy Adhyapak to GitHub Pages

# Builds the app and publishes it to Pages on every push to main.
# `configure-pages` with enablement turns Pages on the first time this runs,
# so the site needs no manual setup in repository settings.

on:
  push:
    branches: [main]
    paths:
      - 'adhyapak/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adhyapak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adhyapak/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export the app for the web
        working-directory: adhyapak/apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist

      - name: Prepare the site
        working-directory: adhyapak/apps/mobile
        run: |
          # Client-side routes must survive a refresh, and Jekyll would eat _expo/.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: adhyapak/apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
