name: Deploy Adhyapak to GitHub Pages

# Builds the app and publishes it to the gh-pages branch, which is the source
# this repository's Pages site is served from. Publishing by branch rather than
# through actions/deploy-pages keeps the existing Pages configuration working —
# deploy-pages requires the source to be set to "GitHub Actions" instead.

on:
  push:
    branches: [main]
    paths:
      - 'adhyapak/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adhyapak/package-lock.json

      - name: Install dependencies
        working-directory: adhyapak
        run: npm ci

      - name: Typecheck
        working-directory: adhyapak
        run: npm run typecheck

      - name: Export the app for the web
        working-directory: adhyapak/apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo export --platform web --output-dir dist

      # The website is a separate Next.js app and carries the Studio — bulk
      # import, draft review and PYQ analytics. It is published under /web/ so
      # both halves of the product are reachable from one Pages site.
      - name: Export the website
        working-directory: adhyapak/apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /D/web
        run: npx next build

      - name: Prepare the site
        working-directory: adhyapak/apps/mobile
        run: |
          # Client-side routes must survive a refresh, and Jekyll would eat _expo/.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          cp -r ../web/out dist/web

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: adhyapak/apps/mobile/dist
          publish_branch: gh-pages
          commit_message: 'Deploy ${{ github.sha }}'
