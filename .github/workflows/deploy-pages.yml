name: Deploy Adhyapak to GitHub Pages

# Builds the app and publishes it to the gh-pages branch, which is the source
# this repository's Pages site is served from. Publishing by branch rather than
# through actions/deploy-pages keeps the existing Pages configuration working —
# deploy-pages requires the source to be set to "GitHub Actions" instead.

on:
  push:
    branches: [main]
    paths:
      - 'adhyapak/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adhyapak/package-lock.json

      - name: Install dependencies
        working-directory: adhyapak
        run: npm ci

      # The gates run before the build, and each one fails the job. Until this
      # existed the workflow typechecked and nothing else, so a broken grading
      # engine or a lint error deployed green — the tests were only ever run by
      # whoever remembered to run them.
      - name: Typecheck
        working-directory: adhyapak
        run: npm run typecheck

      - name: Lint
        working-directory: adhyapak
        run: npm run lint

      - name: Test
        working-directory: adhyapak
        run: npm test

      # Supabase credentials are compiled into the client bundles at build time.
      # With the secrets unset both apps fall back to bundled content — the same
      # offline mode they run in today — so this is safe to merge before the
      # database exists. Set SUPABASE_URL and SUPABASE_ANON_KEY as repository
      # secrets (Settings → Secrets and variables → Actions) to activate it.
      - name: Export the app for the web
        working-directory: adhyapak/apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npx expo export --platform web --output-dir dist

      # The website is a separate Next.js app and carries the Studio — bulk
      # import, draft review and PYQ analytics. It is published under /web/ so
      # both halves of the product are reachable from one Pages site.
      # --- WEB PAUSED: apps/web renamed to apps/_web-paused. This step and
      # the copy below are disabled until the website is resumed. ---
      # - name: Export the website
      # working-directory: adhyapak/apps/web
      # env:
      # NEXT_PUBLIC_BASE_PATH: /D/web
      # NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      # NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # run: npx next build

      - name: Prepare the site
        working-directory: adhyapak/apps/mobile
        run: |
          # Client-side routes must survive a refresh, and Jekyll would eat _expo/.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          # WEB PAUSED: cp -r ../web/out dist/web

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: adhyapak/apps/mobile/dist
          publish_branch: gh-pages
          commit_message: 'Deploy ${{ github.sha }}'
