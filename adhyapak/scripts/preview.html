<!doctype html>
<meta charset="utf-8" />
<title>Adhyapak — phone preview</title>

<!--
  A handset-shaped window onto the dev server.

  The Expo app is responsive: below 600pt it lays out for a phone, above 1024pt
  it spreads into three columns and a 1120pt column. Open it in a normal browser
  window and you get the wide layout, which reads as "the mobile app is showing
  me the website" when it is really the same app doing what it was asked to do.
  This frames it at a real handset width so the phone layout is what you see.

  Open it over http, not by double-clicking the file: `file://` and the dev
  server are different origins, and some of what the app does — storage, the
  session — behaves differently across that line.

      npm run preview      # serves this at http://localhost:8090

  SIGNING IN

  Google will not render inside a frame; it answers with a bare 403. So the app
  opens it in a real window instead, which is the only thing that can work. Do
  the sign-in there, close that window, and come back here — the session lives
  in localStorage against the same origin, so the frame picks it up on its next
  load, and the checkbox below reloads it for you when the tab regains focus.

  The OTP path has none of that trouble: no window, no crypto, no frame. If a
  test number is configured in Supabase, prefer it.
-->

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1e1b4b;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px;
  }
  h1 { color: #fff; font-size: 14px; font-weight: 600; margin: 0; opacity: 0.75 }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center }
  select, button {
    font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px;
    border: 1px solid #4b4487; background: #2a2560; color: #fff; cursor: pointer;
  }
  button:hover { background: #372f74 }
  label { color: #cfc8ee; font-size: 12px; display: flex; gap: 6px; align-items: center }
  .tip {
    max-width: 540px; color: #cfc8ee; font-size: 12px; line-height: 1.55; text-align: center;
    background: #2a2560; border: 1px solid #4b4487; border-radius: 10px; padding: 9px 13px;
  }
  .tip b { color: #fff }
  .frame {
    border: 12px solid #0f0d2b; border-radius: 38px; overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8); background: #faf9ff;
  }
  iframe { display: block; border: 0; width: 390px; height: 844px }
</style>

<h1>Adhyapak — phone preview</h1>

<div class="row">
  <select id="size" aria-label="Device size">
    <option value="390x844">iPhone 14 — 390 × 844</option>
    <option value="360x800">Pixel 7 — 360 × 800</option>
    <option value="320x568">iPhone SE — 320 × 568</option>
    <option value="430x932">iPhone Pro Max — 430 × 932</option>
    <option value="768x1024">iPad — 768 × 1024</option>
  </select>
  <select id="target" aria-label="Which build">
    <option value="http://localhost:8081/">dev server — localhost:8081</option>
    <option value="https://arjun233680.github.io/D/">live — github.io/D</option>
  </select>
  <button id="reload">Reload frame</button>
  <label><input type="checkbox" id="auto" checked /> reload when this tab regains focus</label>
</div>

<div class="tip">
  <b>Signing in?</b> Google opens its own window — that is normal, and it draws the
  app at desktop width. Finish there, close it, and come back: this frame reloads
  and you are signed in, at phone size.
</div>

<div class="frame"><iframe id="app" title="Adhyapak" src="http://localhost:8081/"></iframe></div>

<script>
  const app = document.getElementById('app');
  const reload = () => { app.src = app.src; };

  document.getElementById('size').onchange = (e) => {
    const [w, h] = e.target.value.split('x');
    app.style.width = `${w}px`;
    app.style.height = `${h}px`;
  };
  document.getElementById('target').onchange = (e) => { app.src = e.target.value; };
  document.getElementById('reload').onclick = reload;

  // Coming back from the sign-in window is the moment this frame is stale, so
  // that is when it refreshes — not on a timer, which would throw away whatever
  // screen you were looking at every few seconds.
  let away = false;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { away = true; return; }
    if (away && document.getElementById('auto').checked) reload();
    away = false;
  });
</script>
